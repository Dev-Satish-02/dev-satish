<title>Dev Satish Portfolio Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a slim control bar over a full-height stage that holds the site in a scaled frame. */
  :root {
    --bg: #f6f1e7;
    --bar: #17111a;
    --bar-fg: #f6f1e7;
    --muted: #b9adb4;
    --accent: #d21f3c;
    --stage: #e6dfd1;
    --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f0b11; --stage: #1d171f; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f0b11; --stage: #1d171f; color-scheme: dark; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: var(--ui);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bar);
    color: var(--bar-fg);
  }
  .name {
    font-weight: 600;
    font-size: 14px;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .name i { width: 8px; height: 8px; background: var(--accent); display: inline-block; }
  .seg { display: inline-flex; border: 1px solid #4a3d45; }
  .seg button, .btn {
    font: 600 12.5px var(--ui);
    padding: 7px 12px;
    background: transparent;
    color: var(--bar-fg);
    border: 0;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .btn { border: 1px solid #4a3d45; }
  .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint {
    width: 100%;
    font: 12px var(--mono);
    color: var(--muted);
  }
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--stage);
  }
  .fallback {
    position: absolute;
    inset: auto 0 0 0;
    margin: 0;
    padding: 14px max(16px, env(safe-area-inset-left, 0px));
    background: var(--bar);
    color: var(--bar-fg);
    font-size: 14px;
  }
  .fallback a { color: #fff; font-weight: 600; }
  #site {
    position: absolute;
    top: 0;
    border: 0;
    transform-origin: 0 0;
    background: #f6f1e7;
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">

<div class="bar">
  <span class="name"><i aria-hidden="true"></i>Dev Satish &middot; preview</span>
  <div class="seg" role="group" aria-label="View">
    <button type="button" id="view-desktop" data-mode="desktop">Desktop</button>
    <button type="button" id="view-phone" data-mode="phone">Phone</button>
  </div>
  <button type="button" class="btn" id="replay">Replay intro</button>
  <p class="hint" id="hint" hidden>Turn your phone sideways for a bigger desktop view, or pinch to zoom.</p>
</div>
<div class="stage" id="stage">
  <iframe id="site" src="site.html" title="Dev Satish portfolio"></iframe>
  <p class="fallback" id="fallback" hidden>
    The preview frame couldn't load here. <a href="site.html">Open the site directly</a>.
  </p>
</div>

<script>
  (function () {
    var DESKTOP_WIDTH = 1280; // a typical laptop: well above the site's 900px breakpoint
    var PHONE_WIDTH = 390;
    var MAX_DESKTOP_HEIGHT = 1000;
    var frame = document.getElementById('site');
    var stage = document.getElementById('stage');
    var hint = document.getElementById('hint');
    var buttons = document.querySelectorAll('.seg button');
    var mode = 'desktop';
    try { mode = localStorage.getItem('preview-mode') || 'desktop'; } catch (e) {}

    function layout() {
      var W = stage.clientWidth;
      var H = stage.clientHeight;
      if (mode === 'desktop') {
        var s = Math.min(1, W / DESKTOP_WIDTH);
        // a laptop-shaped viewport: never taller than 1000px, or the scenery scales up oddly
        var h = Math.min(H / s, MAX_DESKTOP_HEIGHT);
        frame.style.width = DESKTOP_WIDTH + 'px';
        frame.style.height = h + 'px';
        frame.style.transform = 'scale(' + s + ')';
        frame.style.left = s < 1 ? '0px' : (W - DESKTOP_WIDTH) / 2 + 'px';
        frame.style.top = Math.max(0, (H - h * s) / 2) + 'px';
        hint.hidden = !(W < 700 && H > W);
      } else {
        var w = Math.min(W, PHONE_WIDTH);
        frame.style.width = w + 'px';
        frame.style.height = H + 'px';
        frame.style.transform = 'none';
        frame.style.left = (W - w) / 2 + 'px';
        frame.style.top = '0px';
        hint.hidden = true;
      }
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        mode = b.dataset.mode;
        try { localStorage.setItem('preview-mode', mode); } catch (e) {}
        layout();
      });
    });
    document.getElementById('replay').addEventListener('click', function () {
      frame.src = 'site.html?r=' + Date.now();
    });
    // if the host refuses to frame the site, offer a direct link instead of a blank stage
    frame.addEventListener('load', function () {
      var ok = false;
      try { ok = Boolean(frame.contentDocument && frame.contentDocument.getElementById('root')); } catch (e) {}
      document.getElementById('fallback').hidden = ok;
    });
    new ResizeObserver(layout).observe(stage);
    layout();
  })();
</script>
